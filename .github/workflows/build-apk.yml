name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system deps
        run: |
          sudo apt update
          sudo apt install -y unzip wget libffi-dev libssl-dev libltdl-dev \
            autoconf automake libtool pkg-config zlib1g-dev \
            libncurses5-dev cmake libtinfo5

          python -m pip install --upgrade pip
          python -m pip install \
            buildozer==1.6.0 \
            python-for-android==2024.1.21 \
            cython==0.29.33 \
            virtualenv

      - name: Build APK
        run: |
          rm -rf .buildozer
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: poolaimassist-apk
          path: bin/*.apk
          if-no-files-found: error
